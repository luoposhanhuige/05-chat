# ### Key Grammar of YAML
# * **Key-Value Pairs:** Data is defined using a colon and a space (`key: value`).
# * **Indentation:** Hierarchy and nesting are determined by indentation. You must use spaces (tabs are generally not allowed).
# * **Minimal Syntax:** It avoids brackets and quotation marks for standard objects and strings, prioritizing general readability.
# * **Comments:** Any line starting with `#` is a comment and is ignored during parsing.

# ### JSON Equivalent
# JSON expresses the same hierarchical data using curly braces, quotation marks, and commas. Your app.yml file would look like this in `.json` format:

# ```json
# {
#   "server": {
#     "port": 6688
#   }
# }
# ```

# The highlighted code is in PEM format.

# More specifically:

# sk contains a PEM-encoded private key
# pk contains a PEM-encoded public key
# From the headers:

# -----BEGIN PRIVATE KEY----- → PKCS#8 PEM private key
# -----BEGIN PUBLIC KEY----- → SubjectPublicKeyInfo PEM public key
# And based on your earlier openssl genpkey -algorithm ed25519, these are Ed25519 keys encoded as Base64 inside PEM blocks.


# **PEM** stands for **Privacy-Enhanced Mail**, but in practice it is a standard text format for storing cryptographic data such as:

# - private keys
# - public keys
# - certificates

# ## What PEM looks like

# PEM is plain text with:

# - a header line
# - Base64-encoded data
# - a footer line

# Example structure:

# - `-----BEGIN PRIVATE KEY-----`
# - `...base64 text...`
# - `-----END PRIVATE KEY-----`

# So PEM is **text**, not binary.

# ## Why it can be included inside `.yml`

# Because YAML can store **multi-line strings**.

# In your file:

# ```yaml
# sk: |
#   -----BEGIN PRIVATE KEY-----
#   ...
#   -----END PRIVATE KEY-----
# ```

# the `|` means:

# - treat the following indented lines as one literal multi-line string
# - preserve line breaks

# So YAML is not interpreting the PEM contents as YAML syntax. It is just storing that PEM block as a string value.

# ## In short

# - **PEM** = text format for keys/certificates
# - **YAML** can hold multi-line text values
# - therefore PEM can be embedded inside YAML without any problem

