# Port Categories Explained
# /*
# ┌──────────────────────────────────────────────────────────────┐
# │              PORT NUMBER RANGES BY CATEGORY                  │
# └──────────────────────────────────────────────────────────────┘

# WELL-KNOWN PORTS (0-1023)
# ═══════════════════════════════════════════════════════════════
# Reserved by IANA (Internet Assigned Numbers Authority)
# Standardized protocols use these:

# Port  Service      Protocol   Purpose
# ────  ───────────  ─────────  ─────────────────────────────
# 21    FTP          TCP        File Transfer Protocol
# 22    SSH          TCP        Secure Shell
# 25    SMTP         TCP        Email sending
# 53    DNS          UDP/TCP    Domain Name System
# 80    HTTP         TCP        Web (unencrypted) ← STANDARD
# 110   POP3         TCP        Email retrieval
# 143   IMAP         TCP        Email (IMAP4)
# 443   HTTPS        TCP        Web (encrypted) ← STANDARD
# 3306  MySQL        TCP        Database
# 5432  PostgreSQL   TCP        Database
# ────  ───────────  ─────────  ─────────────────────────────

# Examples in your app:
# ✓ Port 5432 → PostgreSQL (standard/well-known)
# ✗ Port 6688 → Chat Server (custom/arbitrary)


# REGISTERED PORTS (1024-49151)
# ═══════════════════════════════════════════════════════════════
# Can be registered with IANA for specific services
# Or used by applications needing high numbers

# Port    Service              Purpose
# ──────  ─────────────────    ─────────────────────────────
# 1433    Microsoft SQL Server Database
# 3000    Node.js dev default  Development web servers
# 5000    Flask/Python dev     Development web servers
# 6379    Redis                In-memory cache
# 8000    Django dev           Development web servers
# 8080    Proxy/Alt HTTP       Alternative HTTP
# 9000    Hadoop               Big data processing
# 27017   MongoDB              Database
# ────────  ─────────────────    ─────────────────────────────

# Your choice of 6688:
# ✓ Falls in this range
# ✓ Not registered
# ✓ Arbitrary choice for your app
# ✓ Common for development


# DYNAMIC/PRIVATE PORTS (49152-65535)
# ═══════════════════════════════════════════════════════════════
# Ephemeral ports, auto-assigned by OS for client connections

# Example:
# Client browser → OS assigns ephemeral port (e.g., 54321)
#                 → Connects to server:6688
#                 → Connection tuple: 127.0.0.1:54321 ↔ 127.0.0.1:6688

# */



# Port is an Index to Point to a Process
# Exactly! Port is like an index/address used by the OS to route data to the correct process. Let me explain:

# /*
# ┌──────────────────────────────────────────────────────┐
# │             PORT AS AN INDEX                         │
# ├──────────────────────────────────────────────────────┤
# │                                                      │
# │  Think of ports like:                               │
# │  • Apartment numbers in a building                  │
# │  • Mailbox numbers at a post office                 │
# │  • Channel numbers on TV                            │
# │  • House addresses on a street                      │
# │                                                      │
# │  Each port number → unique process/service          │
# │                                                      │
# │  Port Table (maintained by OS kernel):              │
# │  ═════════════════════════════════════════         │
# │  Index    Service              Process              │
# │  ─────    ──────────────────   ─────────────       │
# │  22       SSH                  sshd (PID: 100)     │
# │  53       DNS                  systemd-resolve     │
# │  80       HTTP                 nginx (PID: 200)    │
# │  443      HTTPS                nginx (PID: 200)    │
# │  3306     MySQL                mysqld (PID: 300)   │
# │  5432     PostgreSQL           postgres (PID: 400) │
# │  6688     Chat Server ←── ← ← ← chat_server       │
# │           (YOUR APP)           (PID: 500)          │
# │  8000     Django               python (PID: 600)   │
# │  9000     Node.js              node (PID: 700)     │
# │                                                      │
# │  When packet arrives:                              │
# │  Packet destination port: 6688                     │
# │                  ↓                                  │
# │  OS looks up port 6688 in table                    │
# │          ↓                                          │
# │  Finds: chat_server (PID: 500)                     │
# │          ↓                                          │
# │  Routes packet to that process                     │
# │                                                      │
# └──────────────────────────────────────────────────────┘
# */

