# ## How OS Uses Port as Index

# ````rust
# // filepath: How kernel port table works

# /*
# ┌────────────────────────────────────────────────────────┐
# │         OS KERNEL PORT TABLE (Simplified)              │
# ├────────────────────────────────────────────────────────┤
# │                                                        │
# │  struct socket {                                       │
# │      u16 port;              // Port number (index)    │
# │      u32 pid;               // Process ID              │
# │      char *process_name;    // Process name            │
# │      struct buffer *rx_buf; // Receive buffer          │
# │      struct buffer *tx_buf; // Transmit buffer         │
# │      u16 state;             // LISTENING/ESTABLISHED   │
# │      ...                                               │
# │  };                                                    │
# │                                                        │
# │  socket_table[65536];  // Array index by port number  │
# │                                                        │
# │  When app binds to port 6688:                         │
# │  ───────────────────────────────────                 │
# │  socket_table[6688].port = 6688                      │
# │  socket_table[6688].pid = 500              // ChatApp │
# │  socket_table[6688].state = LISTENING                │
# │                                                        │
# │  When packet arrives on port 6688:                    │
# │  ───────────────────────────────────────             │
# │  packet.dest_port = 6688  // From network packet     │
# │            ↓                                          │
# │  lookup: socket = socket_table[6688]                 │
# │            ↓                                          │
# │  Find: pid = 500 (chat_server process)               │
# │            ↓                                          │
# │  Enqueue packet to socket's rx_buf                   │
# │            ↓                                          │
# │  Wake up process 500                                 │
# │                                                        │
# └────────────────────────────────────────────────────────┘
# */

